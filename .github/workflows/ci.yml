name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Run test suite
        run: bun test

      - name: Compile standalone binary
        run: bun run build:bin && ./dist/moex --version

  docker-and-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t moex:latest .

      - name: Test Docker container and native binary extraction via install.sh
        run: |
          docker run --rm moex:latest --version
          ./scripts/install.sh --no-pull --bin-dir /tmp/moex-ci-bin
          /tmp/moex-ci-bin/moex --version
          /tmp/moex-ci-bin/moex --help
          SMOKE_DIR="$(mktemp -d)"
          SMOKE_DB="$(mktemp -u /tmp/moex-ci-db-XXXXXX.sqlite)"
          trap 'rm -rf "$SMOKE_DIR" "$SMOKE_DB"' EXIT
          MOEX_DB_PATH="$SMOKE_DB" /tmp/moex-ci-bin/moex init --dir "$SMOKE_DIR" --name "ci-smoke"
          MOEX_DB_PATH="$SMOKE_DB" /tmp/moex-ci-bin/moex status --dir "$SMOKE_DIR" --json
